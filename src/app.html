<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5, user-scalable=yes" />
		<meta name="text-scale" content="scale" />
		<meta name="theme-color" content="#2BA8A2" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#0C1F1E" media="(prefers-color-scheme: dark)" />
		<meta name="apple-mobile-web-app-capable" content="yes" />

	<body data-sveltekit-preload-data="hover">
