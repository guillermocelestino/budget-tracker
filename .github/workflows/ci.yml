name: CI

on:
  push:
    branches: [main, develop, feat/**, fix/**, chore/**]
  pull_request:
    branches: [main, develop]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npm run check
      - run: npm run test:unit
      - run: npm run build
      - run: npm audit --audit-level=high || true
